name: Browser and database journeys

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Isolated multi-user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Start isolated Supabase and apply migrations
        run: npx supabase start --exclude studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor

      - name: Verify database and browser journeys
        run: npm run test:e2e
